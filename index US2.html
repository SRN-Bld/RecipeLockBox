<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Recipe Box</title>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #77706a;
      --accent: #c8553d;
      --accent-dark: #a24330;
      --border: #e6dfd5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--accent);
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 { margin: 0; font-size: 1.4rem; }
    main { max-width: 760px; margin: 0 auto; padding: 20px; }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--accent);
      padding: 9px 16px;
      background: var(--accent);
      color: white;
    }
    button:hover { background: var(--accent-dark); }
    button.secondary { background: white; color: var(--accent); }
    button.secondary:hover { background: #fbeeea; }
    button.danger { background: white; color: #b00020; border-color: #b00020; }
    button.danger:hover { background: #fdeaea; }
    header button { background: white; color: var(--accent); border-color: white; }
    header button:hover { background: #fbeeea; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .recipe-item { cursor: pointer; }
    .recipe-item:hover { border-color: var(--accent); }
    .recipe-item h3 { margin: 0 0 4px; }
    .tag {
      display: inline-block;
      background: #f3e3dd;
      color: var(--accent-dark);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.8rem;
      margin-right: 6px;
    }
    .muted { color: var(--muted); font-size: 0.9rem; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    .hint { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
    input[type=text], input[type=url], textarea {
      width: 100%;
      font: inherit;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }
    textarea { min-height: 110px; resize: vertical; }
    .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .hidden { display: none; }
    .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
    ul.ingredients { padding-left: 20px; }
    .steps { white-space: pre-wrap; }
    .notes-box { background: #fff9e6; border: 1px solid #f0e2a8; }
    .error { color: #b00020; margin-top: 8px; font-size: 0.9rem; }
    .recipe-item { display: flex; gap: 14px; align-items: center; }
    .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: #eee; }
    .hero { width: 100%; max-height: 340px; object-fit: cover; border-radius: 10px; margin: 8px 0 2px; background: #eee; }
    .credit { font-size: 0.78rem; color: var(--muted); margin: 0 0 8px; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; }
    .photo-grid img { width: 100%; height: 90px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 3px solid transparent; }
    .photo-grid img:hover, .photo-grid img.picked { border-color: var(--accent); }
    select { font: inherit; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: white; max-width: 100%; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 190px; overflow-y: auto; padding: 2px; }
    button.chip { background: white; color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; }
    button.chip:hover { border-color: var(--accent); background: #fbeeea; }
    button.chip.on { background: var(--accent); color: white; border-color: var(--accent); }
    .chip-count { opacity: 0.65; font-size: 0.78rem; }
    .filter-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .match { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 0.82rem; font-weight: 700; margin-right: 6px; }
    .match.full { background: #dff3e4; color: #1f6b35; }
    .match.part { background: #fff1cf; color: #7a5a00; }
    .match.low { background: #eee; color: #555; }
    .need { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .preview { max-width: 220px; max-height: 160px; border-radius: 8px; margin-top: 10px; display: block; }
  </style>
</head>
<body>
  <header>
    <h1>🍲 My Recipe Box</h1>
    <button id="addBtn">+ Add recipe</button>
  </header>

  <main>
    <!-- LIST VIEW -->
    <section id="listView">
      <div class="card hidden" id="filterPanel">
        <label for="cuisineFilter" style="margin-top:0">Cuisine</label>
        <select id="cuisineFilter"></select>

        <label for="ingredientSearch">Ingredients I have <span class="hint">(tap to select, recipes are ranked by how well they match)</span></label>
        <input type="text" id="ingredientSearch" placeholder="Search the ingredient list...">
        <div id="ingredientChips" class="chips"></div>

        <div class="filter-footer">
          <span id="resultCount" class="muted"></span>
          <button type="button" class="secondary" id="clearFilters">Clear filters</button>
        </div>
      </div>
      <div id="recipeList"></div>
    </section>

    <!-- FORM VIEW (add and edit) -->
    <section id="formView" class="hidden">
      <div class="card">
        <h2 id="formTitle">Add a recipe</h2>
        <form id="recipeForm" novalidate>
          <label for="title">Recipe name</label>
          <input type="text" id="title" placeholder="e.g. Chicken Tikka Masala">

          <label for="cuisine">Cuisine <span class="hint">(e.g. Italian, Indian, Mexican)</span></label>
          <input type="text" id="cuisine" placeholder="e.g. Indian">

          <label for="ingredients">Ingredients <span class="hint">(one per line)</span></label>
          <textarea id="ingredients" placeholder="chicken breast&#10;yogurt&#10;garlic"></textarea>

          <label for="instructions">Recipe steps <span class="hint">(just the recipe, no intro story)</span></label>
          <textarea id="instructions" placeholder="1. Marinate the chicken...&#10;2. Cook the sauce..."></textarea>

          <label for="source">Link to original recipe <span class="hint">(optional, leave blank if it's your own)</span></label>
          <input type="url" id="source" placeholder="https://...">

          <label>Photo <span class="hint">(optional)</span></label>
          <button type="button" class="secondary" id="findPhotoBtn">🔍 Find a photo online</button>
          <div id="photoStatus" class="muted" style="margin-top:8px"></div>
          <div id="photoResults" class="photo-grid"></div>

          <label for="image">Photo link <span class="hint">(filled in when you pick a photo above, or paste your own image address)</span></label>
          <input type="url" id="image" placeholder="https://...">
          <input type="hidden" id="imageCredit">
          <img id="photoPreview" class="preview hidden" alt="Photo preview">

          <label for="notes">My notes <span class="hint">(your changes and tweaks)</span></label>
          <textarea id="notes" placeholder="e.g. Use half the chili, add extra garlic"></textarea>

          <div id="formError" class="error"></div>

          <div class="actions">
            <button type="submit">Save recipe</button>
            <button type="button" class="secondary" id="cancelBtn">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <!-- DETAIL VIEW -->
    <section id="detailView" class="hidden">
      <div class="actions" style="margin-top:0; margin-bottom:14px;">
        <button class="secondary" id="backBtn">← Back to all recipes</button>
      </div>
      <div class="card" id="detailCard"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "myRecipeBox.recipes.v1";
    let recipes = loadRecipes();
    let editingId = null;

    // ---------- Storage ----------
    function loadRecipes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveRecipes() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
      } catch (e) {
        alert("Could not save. Your browser may be blocking storage (for example in a private window).");
      }
    }

    // ---------- Helpers ----------
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function parseIngredients(text) {
      // One ingredient per line; trimmed; blank lines removed.
      return text.split("\n").map(line => line.trim()).filter(line => line.length > 0);
    }

    function isValidHttpUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === "http:" || u.protocol === "https:";
      } catch (e) {
        return false;
      }
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // ---------- Views ----------
    const listView = document.getElementById("listView");
    const formView = document.getElementById("formView");
    const detailView = document.getElementById("detailView");

    function showView(view) {
      [listView, formView, detailView].forEach(v => v.classList.add("hidden"));
      view.classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function renderList() {
      const container = document.getElementById("recipeList");
      const panel = document.getElementById("filterPanel");
      if (recipes.length === 0) {
        panel.classList.add("hidden");
        container.innerHTML = '<div class="empty">No recipes yet.<br>Click "+ Add recipe" to save your first one.</div>';
        return;
      }
      panel.classList.remove("hidden");
      renderFilterControls();

      const chosen = selectedIngredients.size > 0;
      let results = recipes.map(r => ({ r, score: scoreRecipe(r) }));
      if (cuisineFilter) {
        results = results.filter(x => (x.r.cuisine || "").trim().toLowerCase() === cuisineFilter);
      }
      if (chosen) {
        results = results.filter(x => x.score.have > 0);
        results.sort((a, b) =>
          b.score.percent - a.score.percent ||
          a.score.missing.length - b.score.missing.length ||
          a.r.title.localeCompare(b.r.title));
      } else {
        results.sort((a, b) => a.r.title.localeCompare(b.r.title));
      }

      const count = document.getElementById("resultCount");
      count.textContent = chosen
        ? "Showing " + results.length + " matching recipe" + (results.length === 1 ? "" : "s") + ", best match first"
        : "Showing " + results.length + " of " + recipes.length + " recipe" + (recipes.length === 1 ? "" : "s");

      if (results.length === 0) {
        container.innerHTML = '<div class="empty">No recipes match these filters.<br>Try removing an ingredient or choosing "All cuisines".</div>';
        return;
      }

      container.innerHTML = results.map(({ r, score }) => {
        let matchHtml = "";
        if (chosen) {
          const cls = score.percent === 100 ? "full" : score.percent >= 60 ? "part" : "low";
          const need = score.missing.length > 0
            ? `<div class="need">You have ${score.have} of ${score.total} ingredients. Still need: ${score.missing.map(escapeHtml).join(", ")}</div>`
            : `<div class="need">You have all ${score.total} ingredients.</div>`;
          matchHtml = `<span class="match ${cls}">${score.percent}% match</span>` + need;
        }
        return `
        <div class="card recipe-item" data-id="${r.id}">
          ${r.image ? `<img class="thumb" src="${escapeHtml(r.image)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}
          <div>
            <h3>${escapeHtml(r.title)}</h3>
            ${matchHtml ? `<div>${matchHtml}</div>` : ""}
            ${r.cuisine ? `<span class="tag">${escapeHtml(r.cuisine)}</span>` : ""}
            <span class="muted">${r.ingredients.length} ingredient${r.ingredients.length === 1 ? "" : "s"}</span>
          </div>
        </div>`;
      }).join("");
      container.querySelectorAll(".recipe-item").forEach(el => {
        el.addEventListener("click", () => openDetail(el.dataset.id));
      });
    }

    function openDetail(id) {
      const r = recipes.find(x => x.id === id);
      if (!r) return;
      const card = document.getElementById("detailCard");
      card.innerHTML = `
        <h2 style="margin-top:0">${escapeHtml(r.title)}</h2>
        ${r.cuisine ? `<span class="tag">${escapeHtml(r.cuisine)}</span>` : ""}

        ${r.image ? `
          <img class="hero" src="${escapeHtml(r.image)}" alt="${escapeHtml(r.title)}" onerror="this.style.display='none'">
          ${r.imageCredit ? `<p class="credit"><a href="${escapeHtml(r.imageCredit)}" target="_blank" rel="noopener noreferrer">Photo credit and license ↗</a></p>` : ""}` : ""}

        <h3>Ingredients</h3>
        <ul class="ingredients">
          ${r.ingredients.map(i => `<li>${escapeHtml(i)}</li>`).join("")}
        </ul>

        <h3>Recipe</h3>
        <div class="steps">${escapeHtml(r.instructions)}</div>

        ${r.notes ? `
          <h3>My notes</h3>
          <div class="card notes-box steps">${escapeHtml(r.notes)}</div>` : ""}

        ${r.source ? `
          <p><a href="${escapeHtml(r.source)}" target="_blank" rel="noopener noreferrer">View original recipe ↗</a></p>` : ""}

        <div class="actions">
          <button id="editBtn">Edit</button>
          <button class="danger" id="deleteBtn">Delete</button>
        </div>
      `;
      document.getElementById("editBtn").addEventListener("click", () => openForm(r.id));
      document.getElementById("deleteBtn").addEventListener("click", () => {
        if (confirm('Delete "' + r.title + '"? This cannot be undone.')) {
          recipes = recipes.filter(x => x.id !== r.id);
          saveRecipes();
          renderList();
          showView(listView);
        }
      });
      showView(detailView);
    }

    function openForm(id) {
      editingId = id || null;
      const r = id ? recipes.find(x => x.id === id) : null;
      document.getElementById("formTitle").textContent = r ? "Edit recipe" : "Add a recipe";
      document.getElementById("title").value = r ? r.title : "";
      document.getElementById("cuisine").value = r ? r.cuisine : "";
      document.getElementById("ingredients").value = r ? r.ingredients.join("\n") : "";
      document.getElementById("instructions").value = r ? r.instructions : "";
      document.getElementById("source").value = r ? r.source : "";
      document.getElementById("notes").value = r ? r.notes : "";
      document.getElementById("image").value = r && r.image ? r.image : "";
      document.getElementById("imageCredit").value = r && r.imageCredit ? r.imageCredit : "";
      document.getElementById("photoResults").innerHTML = "";
      document.getElementById("photoStatus").textContent = "";
      updatePreview();
      document.getElementById("formError").textContent = "";
      showView(formView);
    }

    // ---------- Events ----------
    document.getElementById("addBtn").addEventListener("click", () => openForm(null));
    document.getElementById("cancelBtn").addEventListener("click", () => {
      editingId ? openDetail(editingId) : showView(listView);
    });
    document.getElementById("backBtn").addEventListener("click", () => {
      renderList();
      showView(listView);
    });

    document.getElementById("recipeForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const title = document.getElementById("title").value.trim();
      const cuisine = document.getElementById("cuisine").value.trim();
      const ingredients = parseIngredients(document.getElementById("ingredients").value);
      const instructions = document.getElementById("instructions").value.trim();
      const source = document.getElementById("source").value.trim();
      const notes = document.getElementById("notes").value.trim();
      let image = document.getElementById("image").value.trim();
      let imageCredit = image ? document.getElementById("imageCredit").value.trim() : "";
      const errorBox = document.getElementById("formError");

      if (!title) { errorBox.textContent = "Please give the recipe a name."; return; }
      if (ingredients.length === 0) { errorBox.textContent = "Please add at least one ingredient."; return; }
      if (!instructions) { errorBox.textContent = "Please add the recipe steps."; return; }
      if (source && !isValidHttpUrl(source)) {
        errorBox.textContent = "The link should start with http:// or https://";
        return;
      }

      if (image && !isValidHttpUrl(image)) {
        errorBox.textContent = "The photo link should start with http:// or https://";
        return;
      }

      // No photo chosen? Try to attach one automatically (best match from the search).
      if (!image) {
        const saveBtn = document.querySelector("#recipeForm button[type=submit]");
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
        try {
          const found = await searchPhotos(title, 1);
          if (found.length > 0) {
            image = found[0].thumburl;
            imageCredit = found[0].descriptionurl || "";
          }
        } catch (e) {
          // No internet or search failed: save the recipe without a photo.
        }
        saveBtn.disabled = false;
        saveBtn.textContent = "Save recipe";
      }

      if (editingId) {
        const r = recipes.find(x => x.id === editingId);
        Object.assign(r, { title, cuisine, ingredients, instructions, source, notes, image, imageCredit });
      } else {
        recipes.push({ id: newId(), title, cuisine, ingredients, instructions, source, notes, image, imageCredit });
      }
      saveRecipes();
      renderList();
      showView(listView);
    });

    // ---------- Filtering: cuisine + ingredients ----------
    let selectedIngredients = new Set();
    let cuisineFilter = ""; // stored in lowercase

    // Words at the start of an ingredient line that are amounts, units or filler.
    const LEADING_WORDS = new Set([
      "cup","cups","tbsp","tablespoon","tablespoons","tsp","teaspoon","teaspoons",
      "oz","ounce","ounces","lb","lbs","pound","pounds","g","gram","grams","kg","ml","l",
      "liter","liters","litre","litres","pinch","pinches","dash","dashes","clove","cloves",
      "can","cans","slice","slices","bunch","bunches","handful","stick","sticks",
      "package","packages","pkg","piece","pieces","sprig","sprigs",
      "of","a","an","the","large","medium","small","whole","about","approx"
    ]);

    function singularize(word) {
      if (word === "leaves") return "leaf";
      if (word.length <= 3) return word;
      if (word.endsWith("ies")) return word.slice(0, -3) + "y";
      if (word.endsWith("oes")) return word.slice(0, -2);
      if (word.endsWith("ss") || word.endsWith("us") || word.endsWith("is")) return word;
      if (word.endsWith("s")) return word.slice(0, -1);
      return word;
    }

    // "2 cloves garlic, minced" -> "garlic";  "1/2 cup olive oil" -> "olive oil"
    function normalizeIngredient(line) {
      let t = line.toLowerCase().replace(/\([^)]*\)/g, " ").split(",")[0];
      t = t.replace(/[^\p{L}\p{N}\s\/.\-–']/gu, " ");
      let words = t.split(/\s+/).filter(w => /[\p{L}\p{N}]/u.test(w));
      while (words.length > 1 && (
        /^[\d\p{N}\/.\-–]+$/u.test(words[0]) ||
        /^[\d.\/]+[a-z]{1,3}$/.test(words[0]) ||
        LEADING_WORDS.has(words[0])
      )) {
        words.shift();
      }
      if (words.length) words[words.length - 1] = singularize(words[words.length - 1]);
      return words.join(" ").trim();
    }

    // Does a recipe ingredient (n) count as the chosen ingredient (c)?
    // "chicken breast" matches "chicken"; "olive oil" matches "oil".
    function ingredientMatches(n, c) {
      if (!n || !c) return false;
      if (n === c) return true;
      return (" " + n + " ").includes(" " + c + " ") || (" " + c + " ").includes(" " + n + " ");
    }

    // Percent = shared ingredients / (all recipe ingredients + chosen ingredients the recipe lacks).
    // 100% means the recipe uses exactly the chosen ingredients, nothing more and nothing less.
    function scoreRecipe(r) {
      const names = r.ingredients.map(normalizeIngredient).filter(Boolean);
      const chosen = [...selectedIngredients];
      const matchedRecipe = new Set();
      const matchedChosen = new Set();
      names.forEach((n, i) => {
        chosen.forEach(c => {
          if (ingredientMatches(n, c)) { matchedRecipe.add(i); matchedChosen.add(c); }
        });
      });
      const unmatchedChosen = chosen.length - matchedChosen.size;
      const denominator = names.length + unmatchedChosen;
      return {
        have: matchedRecipe.size,
        total: names.length,
        missing: names.filter((n, i) => !matchedRecipe.has(i)),
        percent: denominator === 0 ? 0 : Math.floor((matchedRecipe.size / denominator) * 100)
      };
    }

    function getKnownIngredients() {
      // name -> number of recipes using it
      const known = new Map();
      recipes.forEach(r => {
        new Set(r.ingredients.map(normalizeIngredient).filter(Boolean)).forEach(n => {
          known.set(n, (known.get(n) || 0) + 1);
        });
      });
      return known;
    }

    function renderFilterControls() {
      // Cuisine dropdown (one entry per cuisine, ignoring capital letters)
      const cuisines = new Map();
      recipes.forEach(r => {
        const c = (r.cuisine || "").trim();
        if (c && !cuisines.has(c.toLowerCase())) cuisines.set(c.toLowerCase(), c);
      });
      if (cuisineFilter && !cuisines.has(cuisineFilter)) cuisineFilter = "";
      const select = document.getElementById("cuisineFilter");
      select.innerHTML = '<option value="">All cuisines</option>' +
        [...cuisines.entries()]
          .sort((a, b) => a[1].localeCompare(b[1]))
          .map(([key, label]) => `<option value="${escapeHtml(key)}">${escapeHtml(label)}</option>`)
          .join("");
      select.value = cuisineFilter;
      renderChips();
    }

    function renderChips() {
      const known = getKnownIngredients();
      selectedIngredients.forEach(n => { if (!known.has(n)) selectedIngredients.delete(n); });
      const search = document.getElementById("ingredientSearch").value.trim().toLowerCase();
      const names = [...known.keys()].sort();
      const shown = names.filter(n => selectedIngredients.has(n) || !search || n.includes(search));
      const box = document.getElementById("ingredientChips");
      box.innerHTML = "";
      if (shown.length === 0) {
        box.innerHTML = '<span class="muted">No ingredients match your search.</span>';
        return;
      }
      // Selected ones first, then the rest alphabetically
      shown.sort((a, b) => (selectedIngredients.has(b) - selectedIngredients.has(a)) || a.localeCompare(b));
      shown.forEach(name => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (selectedIngredients.has(name) ? " on" : "");
        btn.setAttribute("aria-pressed", selectedIngredients.has(name) ? "true" : "false");
        btn.textContent = name + " ";
        const count = document.createElement("span");
        count.className = "chip-count";
        count.textContent = known.get(name);
        btn.appendChild(count);
        btn.addEventListener("click", () => {
          if (selectedIngredients.has(name)) selectedIngredients.delete(name);
          else selectedIngredients.add(name);
          renderList();
        });
        box.appendChild(btn);
      });
    }

    document.getElementById("cuisineFilter").addEventListener("change", (e) => {
      cuisineFilter = e.target.value;
      renderList();
    });
    document.getElementById("ingredientSearch").addEventListener("input", renderChips);
    document.getElementById("clearFilters").addEventListener("click", () => {
      selectedIngredients = new Set();
      cuisineFilter = "";
      document.getElementById("ingredientSearch").value = "";
      renderList();
    });

    // ---------- Photo search (Wikimedia Commons: freely licensed photos) ----------
    function updatePreview() {
      const url = document.getElementById("image").value.trim();
      const img = document.getElementById("photoPreview");
      if (url && isValidHttpUrl(url)) {
        img.src = url;
        img.classList.remove("hidden");
      } else {
        img.classList.add("hidden");
        img.removeAttribute("src");
      }
    }

    async function searchPhotos(title, limit) {
      const params = new URLSearchParams({
        action: "query", format: "json", origin: "*",
        generator: "search", gsrsearch: title + " food", gsrnamespace: "6", gsrlimit: "20",
        prop: "imageinfo", iiprop: "url|mime", iiurlwidth: "800"
      });
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      try {
        const res = await fetch("https://commons.wikimedia.org/w/api.php?" + params.toString(), { signal: controller.signal });
        if (!res.ok) throw new Error("bad response");
        const data = await res.json();
        const pages = data.query ? Object.values(data.query.pages) : [];
        return pages
          .sort((a, b) => (a.index || 0) - (b.index || 0))
          .map(p => p.imageinfo && p.imageinfo[0])
          .filter(i => i && (i.mime === "image/jpeg" || i.mime === "image/png") && i.thumburl)
          .slice(0, limit);
      } finally {
        clearTimeout(timer);
      }
    }

    async function findPhotos() {
      const title = document.getElementById("title").value.trim();
      const status = document.getElementById("photoStatus");
      const grid = document.getElementById("photoResults");
      grid.innerHTML = "";
      if (!title) { status.textContent = "Type the recipe name first, then search."; return; }
      status.textContent = "Searching for photos...";

      try {
        const photos = await searchPhotos(title, 9);
        if (photos.length === 0) {
          status.textContent = "No photos found. Try a simpler name, or paste your own photo link below.";
          return;
        }
        status.textContent = "Click the photo you want to use:";
        photos.forEach(info => {
          const img = document.createElement("img");
          img.src = info.thumburl;
          img.alt = "Photo option";
          img.addEventListener("click", () => {
            document.getElementById("image").value = info.thumburl;
            document.getElementById("imageCredit").value = info.descriptionurl || "";
            grid.querySelectorAll("img").forEach(i => i.classList.remove("picked"));
            img.classList.add("picked");
            updatePreview();
          });
          grid.appendChild(img);
        });
      } catch (e) {
        status.textContent = "Could not reach the photo search (check your internet connection). You can still paste your own photo link below.";
      }
    }

    document.getElementById("findPhotoBtn").addEventListener("click", findPhotos);
    document.getElementById("image").addEventListener("input", () => {
      document.getElementById("imageCredit").value = "";
      updatePreview();
    });

    // ---------- Start ----------
    renderList();
  </script>
</body>
